[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudtrim-cli"
version = "0.2.1"
description = "Find wasted Kubernetes resources: compares pod requests against measured usage, recommends right-sized values, and estimates what the waste costs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Sachu James" },
]
keywords = ["kubernetes", "finops", "cost", "rightsizing", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
cloudtrim = "cloudtrim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudtrim"]
